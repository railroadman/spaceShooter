<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <base href="../../" />
    <title>Balance run</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #sim-result {
        position: fixed;
        left: 0;
        top: 0;
        margin: 0;
        padding: 6px;
        font: 11px monospace;
        color: #8f8;
        background: rgba(0, 0, 0, 0.7);
        max-width: 100vw;
        white-space: pre-wrap;
      }
    </style>
    <script src="assets/js/phaser.min.js"></script>
    <script>
      // python http.server lets browsers cache these: load the sandbox scripts fresh on every run
      ['config-patcher.js', 'boot.js'].forEach((name) => {
        document.write('<script src="sandbox/balance/' + name + '?v=' + Date.now() + '"><\/script>');
      });
    </script>
  </head>
  <body>
    <div id="game-container"></div>
  </body>
</html>
